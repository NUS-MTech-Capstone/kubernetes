apiVersion: batch/v1
kind: Job
metadata:
  name: nest-backend-migrate
  namespace: dendenmushi
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: __NEST_BACKEND_IMAGE__
          command: ["node", "dist/database/migrate.js"]
          env:
            - name: NODE_ENV
              value: production
            - name: AUTH_MODE
              value: alb
            - name: AWS_REGION
              value: ap-southeast-1
            - name: ALB_ARN
              value: __APPLICATION_ALB_ARN__
            - name: COGNITO_USER_POOL_ID
              value: __COGNITO_USER_POOL_ID__
            - name: COGNITO_CLIENT_ID
              value: __COGNITO_CLIENT_ID__
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dendenmushi-webapp-database
                  key: database-url
            - name: DB_SSL
              value: "true"
