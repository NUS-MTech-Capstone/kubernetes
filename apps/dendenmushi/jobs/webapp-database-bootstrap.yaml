apiVersion: batch/v1
kind: Job
metadata:
  name: webapp-database-bootstrap
  namespace: dendenmushi-webapp
  labels:
    app: dendenmushi
    component: webapp-database-bootstrap
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: dendenmushi
        component: webapp-database-bootstrap
    spec:
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: postgres:16-alpine
          env:
            - name: ADMIN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dendenmushi-webapp-bootstrap
                  key: admin-database-url
            - name: APP_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: dendenmushi-webapp-bootstrap
                  key: database-name
            - name: APP_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: dendenmushi-webapp-bootstrap
                  key: username
            - name: APP_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dendenmushi-webapp-bootstrap
                  key: password
          command: ["/bin/sh", "-ec"]
          args:
            - |
              psql "${ADMIN_DATABASE_URL}" \
                -v ON_ERROR_STOP=1 \
                -v app_db="${APP_DATABASE_NAME}" \
                -v app_user="${APP_DATABASE_USER}" \
                -v app_password="${APP_DATABASE_PASSWORD}" <<'SQL'
              SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'app_user', :'app_password')
              WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'app_user') \gexec
              SELECT format('ALTER ROLE %I LOGIN PASSWORD %L', :'app_user', :'app_password') \gexec
              SELECT format('CREATE DATABASE %I OWNER %I', :'app_db', :'app_user')
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'app_db') \gexec
              SQL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
