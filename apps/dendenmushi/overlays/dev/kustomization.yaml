apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - nest-backend-migration.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: dendenmushi-env
    namespace: dendenmushi
    envs:
      - env.properties
    files:
      - SERVER_INVENTORY_STATIC_JSON=server-inventory.static.json

images:
