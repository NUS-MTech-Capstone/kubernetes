apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - nest-backend-migration.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: dendenmushi-env
    namespace: dendenmushi
    envs:
      - env.properties
    files:
      - SERVER_INVENTORY_STATIC_JSON=server-inventory.static.json

images:
  - name: 000000000000.dkr.ecr.ap-southeast-1.amazonaws.com/dendenmushi/session-manager
    newName: 891377133321.dkr.ecr.ap-southeast-1.amazonaws.com/dendenmushi/session-manager
    newTag: b5d06571d0d863aa2e0405b81391303bbe040356
  - name: 000000000000.dkr.ecr.ap-southeast-1.amazonaws.com/dendenmushi/audit-service
    newName: 891377133321.dkr.ecr.ap-southeast-1.amazonaws.com/dendenmushi/audit-service
    newTag: ea0a8bba5a994ce7b9a013c76e118e36e4f890a0
  - name: 000000000000.dkr.ecr.ap-southeast-1.amazonaws.com/dendenmushi/agent-controlplane
    newName: 891377133321.dkr.ecr.ap-southeast-1.amazonaws.com/dendenmushi/agent-controlplane
    newTag: 0cf16dd9db82e6f9bf72c93e87ef70648d9a9133
  - name: 000000000000.dkr.ecr.ap-southeast-1.amazonaws.com/dendenmushi/sts
    newName: 891377133321.dkr.ecr.ap-southeast-1.amazonaws.com/dendenmushi/sts
    newTag: 5f9328ba4cf20dacbbc1378b043218bd01bdc940
  - name: 000000000000.dkr.ecr.ap-southeast-1.amazonaws.com/dendenmushi/proxy-controlplane
    newName: 891377133321.dkr.ecr.ap-southeast-1.amazonaws.com/dendenmushi/proxy-controlplane
    newTag: 5b340d12c42608f7991cd418bf1a685983819008
  - name: 000000000000.dkr.ecr.ap-southeast-1.amazonaws.com/dendenmushi/proxy-dataplane
    newName: 891377133321.dkr.ecr.ap-southeast-1.amazonaws.com/dendenmushi/proxy-dataplane
    newTag: b94f0410634cf55353bc2a55b27c165cb6d14cb5
  - name: 000000000000.dkr.ecr.ap-southeast-1.amazonaws.com/dendenmushi/incident-agent
    newName: 891377133321.dkr.ecr.ap-southeast-1.amazonaws.com/dendenmushi/incident-agent
