    newTag: 9d2693345658098ff11ef2dd2440bbbeb5ff00dd

replacements:
  - source: { kind: ConfigMap, name: dendenmushi-env, fieldPath: data.PROXY_DATAPLANE_ROLE_ARN }
    targets:
      - select: { kind: ServiceAccount, name: proxy-dataplane }
        fieldPaths: ["metadata.annotations.[eks.amazonaws.com/role-arn]"]
  - source: { kind: ConfigMap, name: dendenmushi-env, fieldPath: data.STS_ROLE_ARN }
    targets:
      - select: { kind: ServiceAccount, name: sts }
        fieldPaths: ["metadata.annotations.[eks.amazonaws.com/role-arn]"]
  - source: { kind: ConfigMap, name: dendenmushi-env, fieldPath: data.PROXY_CONTROLPLANE_ROLE_ARN }
    targets:
      - select: { kind: ServiceAccount, name: proxy-controlplane }
        fieldPaths: ["metadata.annotations.[eks.amazonaws.com/role-arn]"]
  - source: { kind: ConfigMap, name: dendenmushi-env, fieldPath: data.SESSION_MANAGER_ROLE_ARN }
    targets:
      - select: { kind: ServiceAccount, name: session-manager }
        fieldPaths: ["metadata.annotations.[eks.amazonaws.com/role-arn]"]
  - source: { kind: ConfigMap, name: dendenmushi-env, fieldPath: data.AUDIT_SERVICE_ROLE_ARN }
    targets:
      - select: { kind: ServiceAccount, name: audit-service }
        fieldPaths: ["metadata.annotations.[eks.amazonaws.com/role-arn]"]
  - source: { kind: ConfigMap, name: dendenmushi-env, fieldPath: data.NEST_BACKEND_ROLE_ARN }
    targets:
      - select: { kind: ServiceAccount, name: nest-backend }
        fieldPaths: ["metadata.annotations.[eks.amazonaws.com/role-arn]"]
  - source: { kind: ConfigMap, name: dendenmushi-env, fieldPath: data.INCIDENT_AGENT_ROLE_ARN }
    targets:
      - select: { kind: ServiceAccount, name: incident-agent }
        fieldPaths: ["metadata.annotations.[eks.amazonaws.com/role-arn]"]
  - source: { kind: ConfigMap, name: dendenmushi-env, fieldPath: data.AGENT_CONTROLPLANE_ROLE_ARN }
    targets:
      - select: { kind: ServiceAccount, name: agent-controlplane }
        fieldPaths: ["metadata.annotations.[eks.amazonaws.com/role-arn]"]
  - source: { kind: ConfigMap, name: dendenmushi-env, fieldPath: data.APPLICATION_CERTIFICATE_ARN }
    targets:
      - select: { kind: Ingress }
        fieldPaths: ["metadata.annotations.[alb.ingress.kubernetes.io/certificate-arn]"]
  - source: { kind: ConfigMap, name: dendenmushi-env, fieldPath: data.ALB_AUTH_IDP_COGNITO }
    targets:
      - select: { kind: Ingress, name: proxy-controlplane }
        fieldPaths: ["metadata.annotations.[alb.ingress.kubernetes.io/auth-idp-cognito]"]
      - select: { kind: Ingress, name: proxy-dataplane }
        fieldPaths: ["metadata.annotations.[alb.ingress.kubernetes.io/auth-idp-cognito]"]
      - select: { kind: Ingress, name: nest-backend-login }
        fieldPaths: ["metadata.annotations.[alb.ingress.kubernetes.io/auth-idp-cognito]"]
      - select: { kind: Ingress, name: nest-backend }
        fieldPaths: ["metadata.annotations.[alb.ingress.kubernetes.io/auth-idp-cognito]"]
      - select: { kind: Ingress, name: agent-controlplane }
        fieldPaths: ["metadata.annotations.[alb.ingress.kubernetes.io/auth-idp-cognito]"]
  - source: { kind: ConfigMap, name: dendenmushi-env, fieldPath: data.APPLICATION_ALB_ARN }
    targets:
      - select: { kind: Deployment, name: proxy-controlplane }
        fieldPaths: ["spec.template.spec.containers.[name=proxy-controlplane].env.[name=ALB_ARN].value"]
      - select: { kind: Deployment, name: agent-controlplane }
        fieldPaths: ["spec.template.spec.containers.[name=agent-controlplane].env.[name=ALB_ARN].value"]
      - select: { kind: Deployment, name: nest-backend }
        fieldPaths: ["spec.template.spec.containers.[name=nest-backend].env.[name=ALB_ARN].value"]
      - select: { kind: Job, name: nest-backend-migrate }
        fieldPaths: ["spec.template.spec.containers.[name=migrate].env.[name=ALB_ARN].value"]
  - source: { kind: ConfigMap, name: dendenmushi-env, fieldPath: data.COGNITO_USER_POOL_ID }
    targets:
      - select: { kind: Deployment, name: proxy-controlplane }
        fieldPaths: ["spec.template.spec.containers.[name=proxy-controlplane].env.[name=COGNITO_USER_POOL_ID].value"]
      - select: { kind: Deployment, name: agent-controlplane }
        fieldPaths: ["spec.template.spec.containers.[name=agent-controlplane].env.[name=COGNITO_USER_POOL_ID].value"]
      - select: { kind: Deployment, name: nest-backend }
        fieldPaths: ["spec.template.spec.containers.[name=nest-backend].env.[name=COGNITO_USER_POOL_ID].value"]
      - select: { kind: Job, name: nest-backend-migrate }
        fieldPaths: ["spec.template.spec.containers.[name=migrate].env.[name=COGNITO_USER_POOL_ID].value"]
  - source: { kind: ConfigMap, name: dendenmushi-env, fieldPath: data.COGNITO_CLIENT_ID }
    targets:
      - select: { kind: Deployment, name: proxy-controlplane }
        fieldPaths: ["spec.template.spec.containers.[name=proxy-controlplane].env.[name=COGNITO_CLIENT_ID].value"]
      - select: { kind: Deployment, name: agent-controlplane }
        fieldPaths: ["spec.template.spec.containers.[name=agent-controlplane].env.[name=COGNITO_CLIENT_ID].value"]
      - select: { kind: Deployment, name: nest-backend }
        fieldPaths: ["spec.template.spec.containers.[name=nest-backend].env.[name=COGNITO_CLIENT_ID].value"]
      - select: { kind: Job, name: nest-backend-migrate }
        fieldPaths: ["spec.template.spec.containers.[name=migrate].env.[name=COGNITO_CLIENT_ID].value"]
  - source: { kind: ConfigMap, name: dendenmushi-env, fieldPath: data.COGNITO_DOMAIN_URL }
    targets:
      - select: { kind: Deployment, name: nest-backend }
        fieldPaths: ["spec.template.spec.containers.[name=nest-backend].env.[name=COGNITO_DOMAIN].value"]
  - source: { kind: ConfigMap, name: dendenmushi-env, fieldPath: data.INCIDENT_ALERTS_QUEUE_URL }
    targets:
      - select: { kind: Deployment, name: incident-agent }
        fieldPaths: ["spec.template.spec.containers.[name=incident-agent].env.[name=INCIDENT_QUEUE_URL].value"]
  - source: { kind: ConfigMap, name: dendenmushi-env, fieldPath: data.EVENTS_TOPIC_ARN }
    targets:
      - select: { kind: Deployment, name: sts }
        fieldPaths: ["spec.template.spec.containers.[name=sts].env.[name=EVENTS_TOPIC_ARN].value"]
      - select: { kind: Deployment, name: proxy-controlplane }
        fieldPaths: ["spec.template.spec.containers.[name=proxy-controlplane].env.[name=EVENTS_TOPIC_ARN].value"]
      - select: { kind: Deployment, name: session-manager }
        fieldPaths: ["spec.template.spec.containers.[name=session-manager].env.[name=EVENTS_TOPIC_ARN].value"]
      - select: { kind: Deployment, name: agent-controlplane }
        fieldPaths: ["spec.template.spec.containers.[name=agent-controlplane].env.[name=EVENTS_TOPIC_ARN].value"]
  - source: { kind: ConfigMap, name: dendenmushi-env, fieldPath: data.AUDIT_EVENTS_QUEUE_URL }
    targets:
      - select: { kind: Deployment, name: audit-service }
        fieldPaths: ["spec.template.spec.containers.[name=audit-service].env.[name=AUDIT_EVENTS_QUEUE_URL].value"]
  - source: { kind: ConfigMap, name: dendenmushi-env, fieldPath: data.INCIDENT_DATABASE_SECRET_ID }
    targets:
      - select: { kind: Deployment, name: incident-agent }
        fieldPaths: ["spec.template.spec.containers.[name=incident-agent].env.[name=DATABASE_SECRET_ID].value"]
      - select: { kind: Deployment, name: agent-controlplane }
        fieldPaths: ["spec.template.spec.containers.[name=agent-controlplane].env.[name=DATABASE_SECRET_ID].value"]
  - source: { kind: ConfigMap, name: dendenmushi-env, fieldPath: data.INCIDENT_AGENT_LANGSMITH_TRACING }
    targets:
      - select: { kind: Deployment, name: incident-agent }
        fieldPaths: ["spec.template.spec.containers.[name=incident-agent].env.[name=LANGSMITH_TRACING].value"]
  - source: { kind: ConfigMap, name: dendenmushi-env, fieldPath: data.INCIDENT_AGENT_LANGSMITH_API_KEY_SECRET_ID }
    targets:
      - select: { kind: Deployment, name: incident-agent }
        fieldPaths: ["spec.template.spec.containers.[name=incident-agent].env.[name=LANGSMITH_API_KEY_SECRET_ID].value"]
  - source: { kind: ConfigMap, name: dendenmushi-env, fieldPath: data.INCIDENT_AGENT_LANGSMITH_PROJECT }
    targets:
      - select: { kind: Deployment, name: incident-agent }
        fieldPaths: ["spec.template.spec.containers.[name=incident-agent].env.[name=LANGSMITH_PROJECT].value"]
  - source: { kind: ConfigMap, name: dendenmushi-env, fieldPath: data.INCIDENT_AGENT_LANGSMITH_ENDPOINT }
    targets:
      - select: { kind: Deployment, name: incident-agent }
        fieldPaths: ["spec.template.spec.containers.[name=incident-agent].env.[name=LANGSMITH_ENDPOINT].value"]
  - source: { kind: ConfigMap, name: dendenmushi-env, fieldPath: data.INCIDENT_AGENT_LANGSMITH_WORKSPACE_ID }
    targets:
      - select: { kind: Deployment, name: incident-agent }
        fieldPaths: ["spec.template.spec.containers.[name=incident-agent].env.[name=LANGSMITH_WORKSPACE_ID].value"]
  - source: { kind: ConfigMap, name: dendenmushi-env, fieldPath: data.SERVER_INVENTORY_STATIC_JSON }
    targets:
      - select: { kind: ConfigMap, name: dendenmushi-config }
        fieldPaths: ["data.SERVER_INVENTORY_STATIC_JSON"]
