apiVersion: batch/v1
kind: Job
metadata:
  name: nest-backend-migrate
  namespace: dendenmushi
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-10"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: 000000000000.dkr.ecr.ap-southeast-1.amazonaws.com/dendenmushi/nest-backend:dev
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          command: ["node", "dist/database/migrate.js"]
          env:
            - name: NODE_ENV
              value: production
            - name: AUTH_MODE
              value: alb
            - name: AWS_REGION
              value: ap-southeast-1
            - name: ALB_ARN
              value: pending
            - name: COGNITO_USER_POOL_ID
              value: pending
            - name: COGNITO_CLIENT_ID
              value: pending
            - name: SSH_GATEWAY_URL
              value: "http://proxy-controlplane:8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dendenmushi-webapp-database
                  key: database-url
            - name: DB_SSL
              value: "true"
            - name: DB_SSL_REJECT_UNAUTHORIZED
              value: "false"
