apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  namespace: dendenmushi-ssh
  labels:
    app: dendenmushi
    component: audit-service
    app.kubernetes.io/name: audit-service
    app.kubernetes.io/part-of: dendenmushi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dendenmushi
      component: audit-service
  template:
    metadata:
      labels:
        app: dendenmushi
        component: audit-service
    spec:
      serviceAccountName: audit-service
      containers:
        - name: audit-service
          image: 000000000000.dkr.ecr.ap-southeast-1.amazonaws.com/dendenmushi/audit-service:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8085
          env:
            - name: PORT
              value: "8085"
            - name: LOG_FORMAT
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: LOG_FORMAT
            - name: OTEL_TRACES_EXPORTER
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: OTEL_TRACES_EXPORTER
            - name: OTEL_METRICS_EXPORTER
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: OTEL_METRICS_EXPORTER
            - name: OTEL_LOGS_EXPORTER
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: OTEL_LOGS_EXPORTER
            - name: CLOUDWATCH_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: CLOUDWATCH_NAMESPACE
            - name: AWS_REGION
              value: ap-southeast-1
            - name: AUDIT_EVENT_CONSUMER_ENABLED
              value: "true"
            - name: AUDIT_EVENTS_QUEUE_URL
              value: __AUDIT_EVENTS_QUEUE_URL__
            - name: STORE_DRIVER
              value: postgres
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dendenmushi-database
                  key: database-url
            - name: SESSION_MANAGER_URL
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: SESSION_MANAGER_URL
            - name: SESSION_AUDIT_RETENTION_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: SESSION_AUDIT_RETENTION_SECONDS
            - name: SESSION_AUDIT_MAX_BYTES_PER_SESSION
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: SESSION_AUDIT_MAX_BYTES_PER_SESSION
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
  namespace: dendenmushi-ssh
  labels:
    app: dendenmushi
    component: audit-service
spec:
  type: ClusterIP
  selector:
    app: dendenmushi
    component: audit-service
  ports:
    - name: http
      port: 8085
      targetPort: http
