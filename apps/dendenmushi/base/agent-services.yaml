apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-tool-policy
  namespace: dendenmushi-agentic
  labels:
    app: dendenmushi
    component: agent-tool-gateway
data:
  policy.json: |
    {
      "version": "v1",
      "default": "deny",
      "callers": {
        "system:serviceaccount:dendenmushi-agentic:incident-agent": {
          "phases": {
            "diagnose": [
              "system_overview",
              "disk_usage",
              "memory_usage",
              "top_processes",
              "service_status",
              "service_logs",
              "health_check",
              "target_probe"
            ]
          }
        },
        "system:serviceaccount:dendenmushi-agentic:agent-controlplane": {
          "phases": {
            "remediate": ["restart_service", "recover_demo_app", "reload_service"],
            "verify": ["service_status", "health_check"]
          }
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-reasoning-agent
  namespace: dendenmushi-agentic
  labels:
    app: dendenmushi
    component: incident-reasoning-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dendenmushi
      component: incident-reasoning-agent
  template:
    metadata:
      labels:
        app: dendenmushi
        component: incident-reasoning-agent
    spec:
      serviceAccountName: incident-reasoning-agent
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: incident-reasoning-agent
          image: 000000000000.dkr.ecr.ap-southeast-1.amazonaws.com/dendenmushi/incident-agent:dev
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8093
          env:
            - { name: INCIDENT_AGENT_COMPONENT, value: reasoning }
            - { name: SERVICE_NAME, value: incident-reasoning-agent }
            - { name: PORT, value: "8093" }
            - { name: AWS_REGION, value: ap-southeast-1 }
            - { name: PLANNER_MODE, value: openai_with_fallback }
            - { name: OPENAI_AUTH_MODE, value: aws_iam }
            - { name: OPENAI_AWS_REGION, value: ap-southeast-1 }
            - { name: OPENAI_GATEWAY_URL, value: __AGENTCORE_OPENAI_GATEWAY_URL__ }
            - { name: OPENAI_MODEL, value: gpt-5.4-2026-03-05 }
            - { name: BEDROCK_MAX_PROMPT_BYTES, value: "131072" }
            - { name: TRANSIENT_RETRY_ATTEMPTS, value: "2" }
            - name: REASONING_AGENT_URL
              value: http://incident-reasoning-agent.dendenmushi-agentic.svc.cluster.local:8093
            - name: STS_URL
              valueFrom:
                configMapKeyRef: { name: dendenmushi-config, key: STS_URL }
            - name: LOG_FORMAT
              valueFrom:
                configMapKeyRef: { name: dendenmushi-config, key: LOG_FORMAT }
            - { name: LANGSMITH_TRACING, value: "false" }
            - { name: LANGSMITH_API_KEY_SECRET_ID, value: __INCIDENT_AGENT_LANGSMITH_API_KEY_SECRET_ID__ }
            - { name: LANGSMITH_PROJECT, value: __INCIDENT_AGENT_LANGSMITH_PROJECT__ }
            - { name: LANGSMITH_ENDPOINT, value: __INCIDENT_AGENT_LANGSMITH_ENDPOINT__ }
            - { name: LANGSMITH_WORKSPACE_ID, value: __INCIDENT_AGENT_LANGSMITH_WORKSPACE_ID__ }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: incident-reasoning-agent
  namespace: dendenmushi-agentic
  labels:
    app: dendenmushi
    component: incident-reasoning-agent
spec:
  type: ClusterIP
  selector:
    app: dendenmushi
    component: incident-reasoning-agent
  ports:
    - { name: http, port: 8093, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-tool-gateway
  namespace: dendenmushi-agentic
  labels:
    app: dendenmushi
    component: agent-tool-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dendenmushi
      component: agent-tool-gateway
  template:
    metadata:
      labels:
        app: dendenmushi
        component: agent-tool-gateway
    spec:
      serviceAccountName: agent-tool-gateway
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-tool-gateway
          image: 000000000000.dkr.ecr.ap-southeast-1.amazonaws.com/dendenmushi/incident-agent:dev
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8094
          env:
            - { name: INCIDENT_AGENT_COMPONENT, value: tool_gateway }
            - { name: SERVICE_NAME, value: agent-tool-gateway }
            - { name: PORT, value: "8094" }
            - { name: TOOL_POLICY_FILE, value: /etc/dendenmushi/policy/policy.json }
            - { name: WORKLOAD_TOKEN_FILE, value: /var/run/secrets/tokens/agent-tool-gateway-token }
            - { name: AGENT_CONTROLPLANE_URL, value: http://agent-controlplane.dendenmushi-agentic.svc.cluster.local:8092 }
            - name: STS_URL
              valueFrom:
                configMapKeyRef: { name: dendenmushi-config, key: STS_URL }
            - name: LOG_FORMAT
              valueFrom:
                configMapKeyRef: { name: dendenmushi-config, key: LOG_FORMAT }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
          volumeMounts:
            - { name: workload-token, mountPath: /var/run/secrets/tokens, readOnly: true }
            - { name: policy, mountPath: /etc/dendenmushi/policy, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: workload-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: dendenmushi-incident-agent
                  expirationSeconds: 900
                  path: agent-tool-gateway-token
        - name: policy
          configMap: { name: agent-tool-policy }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: agent-tool-gateway
  namespace: dendenmushi-agentic
  labels:
    app: dendenmushi
    component: agent-tool-gateway
spec:
  type: ClusterIP
  selector:
    app: dendenmushi
    component: agent-tool-gateway
  ports:
    - { name: http, port: 8094, targetPort: http }
