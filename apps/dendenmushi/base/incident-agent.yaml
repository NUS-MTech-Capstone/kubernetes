apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-agent
  namespace: dendenmushi-agentic
  labels:
    app: dendenmushi
    component: incident-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dendenmushi
      component: incident-agent
  template:
    metadata:
      labels:
        app: dendenmushi
        component: incident-agent
    spec:
      serviceAccountName: incident-agent
      containers:
        - name: incident-agent
          image: 000000000000.dkr.ecr.ap-southeast-1.amazonaws.com/dendenmushi/incident-agent:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8091
          env:
            - name: INCIDENT_AGENT_COMPONENT
              value: coordinator
            - name: SERVICE_NAME
              value: incident-agent
            - name: PORT
              value: "8091"
            - name: LOG_FORMAT
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: LOG_FORMAT
            - name: OTEL_TRACES_EXPORTER
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: OTEL_TRACES_EXPORTER
            - name: OTEL_METRICS_EXPORTER
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: OTEL_METRICS_EXPORTER
            - name: OTEL_LOGS_EXPORTER
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: OTEL_LOGS_EXPORTER
            - name: CLOUDWATCH_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: CLOUDWATCH_NAMESPACE
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: ENVIRONMENT
            - name: AWS_REGION
              value: ap-southeast-1
            - name: INCIDENT_QUEUE_URL
              value: __INCIDENT_ALERTS_QUEUE_URL__
            - name: INCIDENT_CLAIM_LEASE_SECONDS
              value: "120"
            - name: INCIDENT_CLAIM_RENEW_SECONDS
              value: "30"
            - name: DATABASE_SECRET_ID
              value: __INCIDENT_DATABASE_SECRET_ID__
            - name: PROXY_CONTROLPLANE_URL
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: PROXY_CONTROLPLANE_URL
            - name: AGENT_CONTROLPLANE_URL
              value: http://agent-controlplane.dendenmushi-agentic.svc.cluster.local:8092
            - name: REASONING_AGENT_URL
              value: http://incident-reasoning-agent.dendenmushi-agentic.svc.cluster.local:8093
            - name: TOOL_GATEWAY_URL
              value: http://agent-tool-gateway.dendenmushi-agentic.svc.cluster.local:8094/mcp
            - name: STS_URL
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: STS_URL
            - name: PLANNER_MODE
              value: openai_with_fallback
            - name: OPENAI_AUTH_MODE
              value: aws_iam
            - name: OPENAI_AWS_REGION
              value: ap-southeast-1
            - name: OPENAI_MODEL
              value: gpt-5.4-2026-03-05
            - name: WORKLOAD_TOKEN_FILE
              value: /var/run/secrets/tokens/incident-agent-token
            - name: TRANSIENT_RETRY_ATTEMPTS
              value: "2"
          volumeMounts:
            - name: workload-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: workload-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: dendenmushi-incident-agent
                  expirationSeconds: 900
                  path: incident-agent-token
---
apiVersion: batch/v1
kind: Job
metadata:
  name: incident-agent-migrate
  namespace: dendenmushi-agentic
  labels:
    app: dendenmushi
    component: incident-agent-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: dendenmushi
        component: incident-agent-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: 000000000000.dkr.ecr.ap-southeast-1.amazonaws.com/dendenmushi/incident-agent:dev
          imagePullPolicy: Always
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if python -c 'import incident_agent.migrate' >/dev/null 2>&1; then
                exec python -m incident_agent.migrate
              fi

              exec python - <<'PY'
              import os

              from sqlalchemy import create_engine, inspect

              from incident_agent.persistence.store import metadata, normalize_database_url

              database_url = os.environ.get("DATABASE_URL", "")
              if not database_url:
                  raise RuntimeError("DATABASE_URL is required")

              engine = create_engine(normalize_database_url(database_url))
              try:
                  inspector = inspect(engine)
                  existing_tables = set(inspector.get_table_names())
                  expected_tables = {table.name for table in metadata.sorted_tables}
                  missing_tables = sorted(expected_tables - existing_tables)
                  missing_columns = []
                  for table in metadata.sorted_tables:
                      if table.name not in existing_tables:
                          continue
                      existing_columns = {column["name"] for column in inspector.get_columns(table.name)}
                      missing_columns.extend(
                          f"{table.name}.{column.name}"
                          for column in table.columns
                          if column.name not in existing_columns
                      )
                  if missing_tables or missing_columns:
                      details = ", ".join(missing_tables + missing_columns)
                      raise RuntimeError(f"legacy incident database schema is incompatible: {details}")
                  print("Legacy incident database schema is compatible; no migration entrypoint is present.")
              finally:
                  engine.dispose()
              PY
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dendenmushi-database
                  key: database-url
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: incident-agent
  namespace: dendenmushi-agentic
  labels:
    app: dendenmushi
    component: incident-agent
spec:
  type: ClusterIP
  selector:
    app: dendenmushi
    component: incident-agent
  ports:
    - name: http
      port: 8091
      targetPort: http
