apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-agent
  namespace: dendenmushi
  labels:
    app: dendenmushi
    component: incident-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dendenmushi
      component: incident-agent
  template:
    metadata:
      labels:
        app: dendenmushi
        component: incident-agent
    spec:
      serviceAccountName: incident-agent
      containers:
        - name: incident-agent
          image: 000000000000.dkr.ecr.ap-southeast-1.amazonaws.com/dendenmushi/incident-agent:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8091
          env:
            - name: PORT
              value: "8091"
            - name: LOG_FORMAT
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: LOG_FORMAT
            - name: OTEL_TRACES_EXPORTER
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: OTEL_TRACES_EXPORTER
            - name: OTEL_METRICS_EXPORTER
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: OTEL_METRICS_EXPORTER
            - name: OTEL_LOGS_EXPORTER
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: OTEL_LOGS_EXPORTER
            - name: CLOUDWATCH_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: CLOUDWATCH_NAMESPACE
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: ENVIRONMENT
            - name: AWS_REGION
              value: ap-southeast-1
            - name: INCIDENT_QUEUE_URL
              value: __INCIDENT_ALERTS_QUEUE_URL__
            - name: INCIDENT_CLAIM_LEASE_SECONDS
              value: "120"
            - name: INCIDENT_CLAIM_RENEW_SECONDS
              value: "30"
            - name: DATABASE_SECRET_ID
              value: __INCIDENT_DATABASE_SECRET_ID__
            - name: LANGSMITH_TRACING
              value: "false"
            - name: LANGSMITH_API_KEY_SECRET_ID
              value: __INCIDENT_AGENT_LANGSMITH_API_KEY_SECRET_ID__
            - name: LANGSMITH_PROJECT
              value: __INCIDENT_AGENT_LANGSMITH_PROJECT__
            - name: LANGSMITH_ENDPOINT
              value: __INCIDENT_AGENT_LANGSMITH_ENDPOINT__
            - name: LANGSMITH_WORKSPACE_ID
              value: __INCIDENT_AGENT_LANGSMITH_WORKSPACE_ID__
            - name: PROXY_CONTROLPLANE_URL
              value: http://proxy-controlplane:8080
            - name: AGENT_CONTROLPLANE_URL
              value: http://agent-controlplane:8092
            - name: PLANNER_MODE
              value: bedrock_with_fallback
            - name: BEDROCK_REGION
              value: us-east-1
            - name: BEDROCK_MODEL_ID
              value: global.amazon.nova-2-lite-v1:0
            - name: BEDROCK_FALLBACK_ENABLED
              value: "true"
            - name: WORKLOAD_TOKEN_FILE
              value: /var/run/secrets/tokens/incident-agent-token
            - name: TRANSIENT_RETRY_ATTEMPTS
              value: "2"
          volumeMounts:
            - name: workload-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: workload-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: dendenmushi-incident-agent
                  expirationSeconds: 900
                  path: incident-agent-token
---
apiVersion: batch/v1
kind: Job
metadata:
  name: incident-agent-migrate
  namespace: dendenmushi
  labels:
    app: dendenmushi
    component: incident-agent-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: dendenmushi
        component: incident-agent-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: 000000000000.dkr.ecr.ap-southeast-1.amazonaws.com/dendenmushi/incident-agent:dev
          imagePullPolicy: Always
          command: ["python", "-m", "incident_agent.migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dendenmushi-database
                  key: database-url
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: incident-agent
  namespace: dendenmushi
  labels:
    app: dendenmushi
    component: incident-agent
spec:
  type: ClusterIP
  selector:
    app: dendenmushi
    component: incident-agent
  ports:
    - name: http
      port: 8091
      targetPort: http
