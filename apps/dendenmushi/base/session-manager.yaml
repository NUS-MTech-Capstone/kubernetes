apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-manager
  namespace: dendenmushi
  labels:
    app: dendenmushi
    component: session-manager
    app.kubernetes.io/name: session-manager
    app.kubernetes.io/part-of: dendenmushi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dendenmushi
      component: session-manager
  template:
    metadata:
      labels:
        app: dendenmushi
        component: session-manager
    spec:
      containers:
        - name: session-manager
          image: 000000000000.dkr.ecr.ap-southeast-1.amazonaws.com/dendenmushi/session-manager:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: PORT
              value: "8081"
            - name: LOG_FORMAT
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: LOG_FORMAT
            - name: OTEL_TRACES_EXPORTER
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: OTEL_TRACES_EXPORTER
            - name: OTEL_METRICS_EXPORTER
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: OTEL_METRICS_EXPORTER
            - name: OTEL_LOGS_EXPORTER
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: OTEL_LOGS_EXPORTER
            - name: CLOUDWATCH_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: CLOUDWATCH_NAMESPACE
            - name: STORE_DRIVER
              value: postgres
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dendenmushi-database
                  key: database-url
            - name: AUTOMATION_RUN_TTL_SECONDS
              value: "3600"
            - name: SESSION_AUDIT_RETENTION_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: SESSION_AUDIT_RETENTION_SECONDS
            - name: SESSION_AUDIT_MAX_BYTES_PER_SESSION
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: SESSION_AUDIT_MAX_BYTES_PER_SESSION
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: session-manager
  namespace: dendenmushi
  labels:
    app: dendenmushi
    component: session-manager
spec:
  type: ClusterIP
  selector:
    app: dendenmushi
    component: session-manager
  ports:
    - name: http
      port: 8081
      targetPort: http
