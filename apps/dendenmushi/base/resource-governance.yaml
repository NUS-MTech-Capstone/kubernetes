apiVersion: v1
kind: LimitRange
metadata:
  name: dendenmushi-container-defaults
  namespace: dendenmushi-ssh
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 25m
        memory: 64Mi
      default:
        cpu: 500m
        memory: 512Mi
      min:
        cpu: 10m
        memory: 16Mi
      max:
        cpu: "2"
        memory: 2Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dendenmushi-quota
  namespace: dendenmushi-ssh
spec:
  hard:
    requests.cpu: "1.5"
    requests.memory: 3Gi
    limits.cpu: "6"
    limits.memory: 6Gi
    pods: "30"
    count/deployments.apps: "10"
    count/jobs.batch: "10"
    services: "10"
    secrets: "10"
    configmaps: "10"
---
