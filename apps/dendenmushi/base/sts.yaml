apiVersion: apps/v1
kind: Deployment
metadata:
  name: sts
  namespace: dendenmushi-ssh
  labels:
    app: dendenmushi
    component: sts
    app.kubernetes.io/name: sts
    app.kubernetes.io/part-of: dendenmushi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dendenmushi
      component: sts
  template:
    metadata:
      labels:
        app: dendenmushi
        component: sts
    spec:
      serviceAccountName: sts
      containers:
        - name: sts
          image: 000000000000.dkr.ecr.ap-southeast-1.amazonaws.com/dendenmushi/sts:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: PORT
              value: "8082"
            - name: LOG_FORMAT
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: LOG_FORMAT
            - name: OTEL_TRACES_EXPORTER
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: OTEL_TRACES_EXPORTER
            - name: OTEL_METRICS_EXPORTER
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: OTEL_METRICS_EXPORTER
            - name: OTEL_LOGS_EXPORTER
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: OTEL_LOGS_EXPORTER
            - name: CLOUDWATCH_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: CLOUDWATCH_NAMESPACE
            - name: AWS_REGION
              value: ap-southeast-1
            - name: EVENT_PUBLISHER_ENABLED
              value: "true"
            - name: EVENTS_TOPIC_ARN
              value: __EVENTS_TOPIC_ARN__
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: dendenmushi-runtime
                  key: jwt-signing-key
            - name: CHANGE_REQUEST_URL
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: CHANGE_REQUEST_URL
            - name: SERVER_INVENTORY_STATIC_JSON
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: SERVER_INVENTORY_STATIC_JSON
            - name: AUTOMATION_WORKLOAD_AUDIENCE
              value: dendenmushi-incident-agent
            - name: AUTOMATION_WORKLOAD_NAMESPACE
              value: dendenmushi-agentic
            - name: AUTOMATION_WORKLOAD_SERVICE_ACCOUNT
              value: incident-agent
            - name: AUTOMATION_WORKLOAD_SERVICE_ACCOUNTS
              value: incident-agent,agent-controlplane
            - name: AUTOMATION_TOKEN_SERVICE_ACCOUNTS
              value: agent-tool-gateway
            - name: WORKLOAD_IDENTITY_SERVICE_ACCOUNTS
              value: incident-agent,agent-controlplane
            - name: AUTOMATION_TOKEN_TTL_SECONDS
              value: "600"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sts
  namespace: dendenmushi-ssh
  labels:
    app: dendenmushi
    component: sts
spec:
  type: ClusterIP
  selector:
    app: dendenmushi
    component: sts
  ports:
    - name: http
      port: 8082
      targetPort: http
