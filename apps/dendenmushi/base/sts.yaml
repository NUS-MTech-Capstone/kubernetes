apiVersion: apps/v1
kind: Deployment
metadata:
  name: sts
  namespace: dendenmushi
  labels:
    app: dendenmushi
    component: sts
    app.kubernetes.io/name: sts
    app.kubernetes.io/part-of: dendenmushi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dendenmushi
      component: sts
  template:
    metadata:
      labels:
        app: dendenmushi
        component: sts
    spec:
      containers:
        - name: sts
          image: 000000000000.dkr.ecr.ap-southeast-1.amazonaws.com/dendenmushi/sts:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: PORT
              value: "8082"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sts
  namespace: dendenmushi
  labels:
    app: dendenmushi
    component: sts
spec:
  type: ClusterIP
  selector:
    app: dendenmushi
    component: sts
  ports:
    - name: http
      port: 8082
      targetPort: http
