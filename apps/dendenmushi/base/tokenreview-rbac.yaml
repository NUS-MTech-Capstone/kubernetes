apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dendenmushi-sts-tokenreview
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dendenmushi-sts-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dendenmushi-sts-tokenreview
subjects:
  - kind: ServiceAccount
    name: sts
    namespace: dendenmushi-ssh
