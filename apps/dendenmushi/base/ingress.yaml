apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proxy-controlplane
  namespace: dendenmushi
  labels:
    app: dendenmushi
    component: proxy-controlplane
  annotations:
    alb.ingress.kubernetes.io/group.name: dendenmushi-dev
    alb.ingress.kubernetes.io/group.order: "20"
    alb.ingress.kubernetes.io/load-balancer-name: dendenmushi-dev
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: __APPLICATION_CERTIFICATE_ARN__
    alb.ingress.kubernetes.io/auth-type: cognito
    alb.ingress.kubernetes.io/auth-idp-cognito: '{"UserPoolArn":"__COGNITO_USER_POOL_ARN__","UserPoolClientId":"__COGNITO_CLIENT_ID__","UserPoolDomain":"__COGNITO_DOMAIN__"}'
    alb.ingress.kubernetes.io/auth-scope: openid email profile
    alb.ingress.kubernetes.io/auth-session-timeout: "3600"
    alb.ingress.kubernetes.io/auth-on-unauthenticated-request: authenticate
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  ingressClassName: alb
  rules:
    - host: api.ddm.keiyam.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: proxy-controlplane
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proxy-dataplane
  namespace: dendenmushi
  labels:
    app: dendenmushi
    component: proxy-dataplane
  annotations:
    alb.ingress.kubernetes.io/group.name: dendenmushi-dev
    alb.ingress.kubernetes.io/group.order: "10"
    alb.ingress.kubernetes.io/load-balancer-name: dendenmushi-dev
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: __APPLICATION_CERTIFICATE_ARN__
    alb.ingress.kubernetes.io/auth-type: cognito
    alb.ingress.kubernetes.io/auth-idp-cognito: '{"UserPoolArn":"__COGNITO_USER_POOL_ARN__","UserPoolClientId":"__COGNITO_CLIENT_ID__","UserPoolDomain":"__COGNITO_DOMAIN__"}'
    alb.ingress.kubernetes.io/auth-scope: openid email profile
    alb.ingress.kubernetes.io/auth-session-timeout: "3600"
    alb.ingress.kubernetes.io/auth-on-unauthenticated-request: authenticate
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  ingressClassName: alb
  rules:
    - host: api.ddm.keiyam.me
      http:
        paths:
          - path: /sessions/*/ws
            pathType: ImplementationSpecific
            backend:
              service:
                name: proxy-dataplane
                port:
                  number: 8083
