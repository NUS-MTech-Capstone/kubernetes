apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-controlplane
  namespace: dendenmushi
  labels:
    app: dendenmushi
    component: proxy-controlplane
    app.kubernetes.io/name: proxy-controlplane
    app.kubernetes.io/part-of: dendenmushi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dendenmushi
      component: proxy-controlplane
  template:
    metadata:
      labels:
        app: dendenmushi
        component: proxy-controlplane
    spec:
      containers:
        - name: proxy-controlplane
          image: 000000000000.dkr.ecr.ap-southeast-1.amazonaws.com/dendenmushi/proxy-controlplane:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: SESSION_MANAGER_URL
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: SESSION_MANAGER_URL
            - name: STS_URL
              valueFrom:
                configMapKeyRef:
                  name: dendenmushi-config
                  key: STS_URL
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: proxy-controlplane
  namespace: dendenmushi
  labels:
    app: dendenmushi
    component: proxy-controlplane
spec:
  type: ClusterIP
  selector:
    app: dendenmushi
    component: proxy-controlplane
  ports:
    - name: http
      port: 8080
      targetPort: http
