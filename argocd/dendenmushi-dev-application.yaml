apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dendenmushi-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/NUS-MTech-Capstone/kubernetes.git
    targetRevision: main
    path: apps/dendenmushi/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dendenmushi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
